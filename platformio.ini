; Original M5StickC Plus build lives on upstream (anthropics/claude-desktop-buddy).
; This fork targets the M5StickC Plus2 via M5Unified.
[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions_plus2_8MB.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 3145728
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0
